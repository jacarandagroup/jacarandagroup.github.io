<!doctype html>

  <link rel="stylesheet" href="src/framework.css">

<body id="top">

<!-- Header -->

      <div class="flex row items-center justify-between">

          <a href="#result" data-i18n="header_result" class="relative medium no-underline"></a>

            </button>
          
            <div class="language-menu absolute right-0 p-2 border rounded-md z-100" hidden>
              <button type="button" data-lang="en" class="lang-btn active flex items-center justify-between w-full p-3 rounded-md pointer">
                <span>English</span>
              </button>

        <!-- CTA -->

            <span class="block rounded-xs"></span>
            <span class="block rounded-xs"></span>
          </button>

        </div>

        <a href="#result" data-i18n="header_result" class="py-4 px-0 medium no-underline border-bottom"></a>

      <div class="container hero-inner relative">

            <h1 class="normal content-wide" data-i18n="hero_h1"></h1>
            <p class="hero-lead" data-i18n="hero_p"></p>

                <small data-i18n="hero_kya"></small>
              </span>

          </div>
        </div>
      </div>
    </section>

    <!-- 02 — Problems -->

          </li>
          <li class="border-left gap-3 px-5 flex items-center">

            <span data-i18n="problem_work"></span>
          </li>

            <i class="fa-solid fa-head-side-virus mobile-hidden"></i>
            <span data-i18n="problem_anxiety"></span>
          </li>
          <li class="border-left gap-3 px-5 flex items-center">
            <i class="fa-solid fa-square-person-confined mobile-hidden"></i>
            <span data-i18n="problem_confidence"></span>
          </li>
          <li class="gap-3 px-5 flex items-center">
            <i class="fa-solid fa-comments mobile-hidden"></i>
            <span data-i18n="problem_relationships"></span>
          </li>
          <li class="border-left gap-3 px-5 flex items-center">
            <i class="fa-solid fa-handshake mobile-hidden"></i>
            <span data-i18n="problem_trust"></span>
          </li>
          <li class="border-left gap-3 px-5 flex items-center">
            <i class="fa-solid fa-crown mobile-hidden"></i>
            <span data-i18n="problem_success"></span>
          </li>
          <li class="border-left gap-3 px-5 flex items-center">
            <i class="fa-solid fa-house-chimney-crack mobile-hidden"></i>
            <span data-i18n="problem_family"></span>
          </li>
        </ul>

        <div class="border-top pt-10 mt-10 gap-8">
          <div class="toast primary flex row w-full items-center justify-between mobile-column rounded-none shadow-md">
            <div class="toast-body content-wide">
              <strong data-i18n="problems_conclusion"></strong>

            <a href="#start" class="btn outline lg rounded-full bg-surface"><span data-i18n="problems_cta"></span> <span class="mobile-hidden" aria-hidden="true">→</span></a>
          </div>
        </div>

      </div>
    </section>

    <!-- 03 — Insight -->
    <section class="section insight relative overflow-hidden p-0">

        <figure class="insight-photo relative z-0 overflow-hidden">

        </figure>

              </div>
            </div>

            <div>

            </div>
          </div>

              <h5 class="step-title medium" data-i18n="process_step2_title"></h5>
            </div>
            <p data-i18n="process_step2_text"></p>
          </div>

          <div class="step-card stack relative p-0 gap-3">
            <div class="step-top flex items-center gap-6 mb-2">
              <span class="step-number text-xl grid place-center no-shrink rounded-full white">3</span>
              <h5 class="step-title medium" data-i18n="process_step3_title"></h5>
            </div>
            <p data-i18n="process_step3_text"></p>

        </div>

        <div class="process-conclusion flex row tablet-column items-center gap-12 mt-10 pt-8">

          </div>
        </div>
      </div>
      <span class="ornament ornament-ring-4 mobile-hidden absolute pointer-none no-select overflow-hidden right-0 w-auto bottom-0" aria-hidden="true">
        <img src="svg/ornament-ring.svg" alt="" loading="lazy" decoding="async" class="img-cover">

    <!-- 05 — Offer -->
    <section class="section offer relative overflow-hidden" id="result">

      <figure class="offer-photo absolute inset-0" aria-hidden="true">

          <div class="offer-copy stack">

          </figure>

        </div>
      </div>
    </section>
